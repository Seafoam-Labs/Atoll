services:
  atoll:
    build:
      context: .
      dockerfile: Atoll.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - Atoll__DataSource__DataFileUrl=https://aur.archlinux.org/packages-meta-ext-v1.json.gz
      - Atoll__DataSource__RefreshIntervalMinutes=10
      - Atoll__Mongo__ConnectionString=mongodb://admin:change_me@mongo:27017/atoll?authSource=admin
      - Atoll__Mongo__Database=atoll
      - Atoll__Mongo__Collections__Packages=packages
      - Atoll__Mongo__Collections__AurMetadata=aur-metadata
      - Atoll__Mongo__MaxRevisions=10
      - Atoll__Mongo__MaxFileBytes=5242880
      - Atoll__Git__RepositoriesPath=/app/data/repos
      - Atoll__Security__Enabled=true
      - Atoll__Security__ScannerConcurrency=16
      - Atoll__Security__PollIntervalMs=100
      # Set Atoll__Seed__Mode=Off to disable automated package seeding.
      - Atoll__Seed__Mode=Direct
      - Atoll__Seed__Direct__SeedDelayMs=1000
      # Bulk mode (GitHub mirror, ~60 min full sync): set Atoll__Seed__Mode=Bulk and uncomment.
      # - Atoll__Seed__Bulk__MirrorUrl=https://github.com/archlinux/aur
      # - Atoll__Seed__Bulk__CachePath=/app/data/aur-mirror
      # - Atoll__Seed__Bulk__BatchSize=1000
      # - Atoll__Seed__Bulk__BatchDelayMs=1000
      # - Atoll__Seed__Bulk__AurFallbackForNotOnMirror=false
    volumes:
      - atoll-data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.3.7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      # https://jira.mongodb.org/browse/SERVER-121912
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=change_me
    healthcheck:
      test:
        [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok" ]
      interval: 30s
      retries: 5
      start_period: 15s
      timeout: 5s

volumes:
  atoll-data:
  mongo-data:
