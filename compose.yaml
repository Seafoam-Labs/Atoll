services:
  atoll:
    build:
      context: .
      dockerfile: Atoll.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - Atoll__DataSource__DataFileUrl=https://aur.archlinux.org/packages-meta-ext-v1.json.gz
      - Atoll__DataSource__RefreshIntervalMinutes=5
      - Atoll__DataSource__PruneDeletedPackages=true
      - Atoll__Mongo__ConnectionString=mongodb://admin:change_me@mongo:27017/atoll?authSource=admin
      - Atoll__Mongo__Database=atoll
      - Atoll__Mongo__Collections__Packages=packages
      - Atoll__Mongo__Collections__PackageRevisions=package-revisions
      - Atoll__Mongo__Collections__AurMetadata=aur-metadata
      - Atoll__Mongo__MaxRevisions=10
      - Atoll__Mongo__MaxFileBytes=5242880
      - Atoll__Git__RepositoriesPath=/app/data/repos
      - Atoll__Security__Enabled=true
      - Atoll__Security__ScannerConcurrency=2
      - Atoll__Security__PollIntervalMs=100
      - Atoll__Mutations__Enabled=true
      - Atoll__Ui__ExternalBaseUrl=http://localhost:8080
      # Set Atoll__Seed__Mode=Off to retain only manually seeded packages.
      - Atoll__Seed__Mode=Bulk
      - Atoll__Seed__Bulk__MirrorUrl=https://github.com/archlinux/aur
      - Atoll__Seed__Bulk__CachePath=/app/data/aur-mirror
      - Atoll__Seed__Bulk__BatchSize=1000
      - Atoll__Seed__Bulk__BatchDelayMs=1000
      - Atoll__Seed__Bulk__Parallelism=2
      - Atoll__Seed__Bulk__AurFallbackForNotOnMirror=true
      - Atoll__Refresh__Enabled=true
      - Atoll__Refresh__BatchSize=1000
      - Atoll__Refresh__BatchDelayMs=1000
      - Atoll__Refresh__Parallelism=2
      - Atoll__Refresh__MaxPackagesPerRun=10000
      - Atoll__Refresh__MaxStalenessHours=24
      - Atoll__Refresh__MirrorUrl=https://github.com/archlinux/aur
      - Atoll__Refresh__CachePath=/app/data/aur-mirror
    # - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    # - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    # - OTEL_METRIC_EXPORT_INTERVAL=10000
    volumes:
      - atoll-data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:8.3.7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      # https://jira.mongodb.org/browse/SERVER-121912
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=change_me
    healthcheck:
      test:
        [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok" ]
      interval: 30s
      retries: 5
      start_period: 15s
      timeout: 5s

  # OpenTelemetry backend for development: OTel Collector, Prometheus, Loki, Tempo, Pyroscope, and Grafana in one image.
  # Grafana: http://localhost:3000 (admin/admin); the "Atoll" dashboard is provisioned and set as home.
  lgtm:
    image: grafana/otel-lgtm:0.30.0@sha256:46ca028e294bd728e8e930a28e887f640a8f2a9533cc283f79bcc6ab73d2ffd8
    profiles: [ "observability" ]
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/atoll.json
    volumes:
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/atoll.yaml:ro
      - ./observability/grafana/atoll.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/atoll.json:ro

volumes:
  atoll-data:
  mongo-data:
